name: Import Lovable source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Lovable source
        shell: bash
        run: |
          set -e

          ZIP="ImageSplitter-Lovable-Android-source.zip"
          TEMP="/tmp/imagesplitter"

          test -f "$ZIP"

          rm -rf "$TEMP"
          mkdir -p "$TEMP"
          unzip -oq "$ZIP" -d "$TEMP"

          shopt -s dotglob nullglob
          FILES=("$TEMP"/*)

          # إذا كان الـ ZIP يحتوي مجلدًا رئيسيًا واحدًا
          if [ "${#FILES[@]}" -eq 1 ] && [ -d "${FILES[0]}" ]; then
            SOURCE="${FILES[0]}"
          else
            SOURCE="$TEMP"
          fi

          # لا نحذف .git أو GitHub Actions
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "$ZIP" \
            -exec rm -rf {} +

          cp -a "$SOURCE"/. ./

          rm -f "$ZIP"

      - name: Commit imported project
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Import complete Lovable source and Android integration"
          git push origin HEAD:main