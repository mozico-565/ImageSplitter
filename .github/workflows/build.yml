name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Test split math
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Give APK a phone-friendly name
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ImageSplitter-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ImageSplitter-APK
          path: app/build/outputs/apk/debug/ImageSplitter-debug.apk
          if-no-files-found: error
