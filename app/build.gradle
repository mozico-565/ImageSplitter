plugins { id 'com.android.application' }

android {
    namespace 'com.imagesplitter.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.imagesplitter.app'
        minSdk 29
        targetSdk 35
        versionCode 3
        versionName '1.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources {
        noCompress += ['tflite']
    }
}

dependencies {
    implementation 'org.tensorflow:tensorflow-lite:2.16.1'
    testImplementation 'junit:junit:4.13.2'
}
