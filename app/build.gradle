plugins { id 'com.android.application' }

android {
    namespace 'com.imagesplitter.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.imagesplitter.app'
        minSdk 29
        targetSdk 35
        versionCode 3
        versionName '1.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

// The web upload flow keeps the binary font at the repository root.
// Prepare the Android font resource before resource compilation.
tasks.register('prepareKalamFont', Copy) {
    from(rootProject.file('kalam_regular.ttf'))
    into(file('src/main/res/font'))
}
tasks.named('preBuild').configure {
    dependsOn(tasks.named('prepareKalamFont'))
}
