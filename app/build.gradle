plugins { id 'com.android.application' }

android {
    namespace 'com.imagesplitter.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.imagesplitter.app'
        minSdk 29
        targetSdk 35
        versionCode 5
        versionName '1.3.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources {
        noCompress += ['tflite']
    }
    sourceSets {
        main.assets.srcDir(layout.buildDirectory.dir('generated/assets/ai'))
        // Keep custom resources outside AGP's own build/generated/res tree.
        main.res.srcDir(layout.buildDirectory.dir('custom-res/main'))
    }
}

dependencies {
    implementation 'org.tensorflow:tensorflow-lite:2.16.1'
    testImplementation 'junit:junit:4.13.2'
}

def realEsrganFile = layout.buildDirectory.file('generated/assets/ai/real_esrgan_x4v3.tflite')
def deepLabFile = layout.buildDirectory.file('generated/assets/ai/deeplabv3_257_mv_gpu.tflite')
tasks.register('prepareRealEsrgan') {
    outputs.file(realEsrganFile)
    doLast {
        File target = realEsrganFile.get().asFile
        if (!target.exists() || target.length() != 4_878_664L) {
            target.parentFile.mkdirs()
            URL modelUrl = new URI('https://github.com/john-rocky/LiteRT-Models/releases/download/v1/real_esrgan_x4v3.tflite').toURL()
            modelUrl.withInputStream { input -> target.withOutputStream { output -> output << input } }
        }
        if (target.length() != 4_878_664L) {
            throw new GradleException('Real-ESRGAN model download is incomplete')
        }
    }
}

tasks.register('prepareDeepLab') {
    outputs.file(deepLabFile)
    doLast {
        File target = deepLabFile.get().asFile
        if (!target.exists() || target.length() != 2_779_264L) {
            target.parentFile.mkdirs()
            URL modelUrl = new URI('https://storage.googleapis.com/download.tensorflow.org/models/tflite/gpu/deeplabv3_257_mv_gpu.tflite').toURL()
            modelUrl.withInputStream { input -> target.withOutputStream { output -> output << input } }
        }
        if (target.length() != 2_779_264L) {
            throw new GradleException('DeepLabV3 model download is incomplete')
        }
    }
}

tasks.register('prepareKalamFont', Copy) {
    from(rootProject.file('kalam_regular.ttf'))
    into(layout.buildDirectory.dir('custom-res/main/font'))
}

tasks.named('preBuild').configure {
    dependsOn(tasks.named('prepareRealEsrgan'))
    dependsOn(tasks.named('prepareDeepLab'))
    dependsOn(tasks.named('prepareKalamFont'))
}
