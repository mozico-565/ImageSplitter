plugins {
    id 'com.android.application' version '8.7.3' apply false
}

def decodeText = { String value ->
    new String(java.util.Base64.getDecoder().decode(value), 'UTF-8')
}

def appGradleFile = file('app/build.gradle')
if (appGradleFile.exists()) {
    String appGradle = appGradleFile.getText('UTF-8')

    String oldDep = decodeText('ZGVwZW5kZW5jaWVzIHsKICAgIHRlc3RJbXBsZW1lbnRhdGlvbiAnanVuaXQ6anVuaXQ6NC4xMy4yJwp9')
    String newDep = decodeText('ZGVwZW5kZW5jaWVzIHsKICAgIGltcGxlbWVudGF0aW9uICdvcmcudGVuc29yZmxvdzp0ZW5zb3JmbG93LWxpdGU6Mi4xNi4xJwogICAgdGVzdEltcGxlbWVudGF0aW9uICdqdW5pdDpqdW5pdDo0LjEzLjInCn0=')
    if (appGradle.contains(oldDep)) {
        appGradle = appGradle.replace(oldDep, newDep)
    }

    String oldAndroidEnd = decodeText('ICAgIGNvbXBpbGVPcHRpb25zIHsKICAgICAgICBzb3VyY2VDb21wYXRpYmlsaXR5IEphdmFWZXJzaW9uLlZFUlNJT05fMTcKICAgICAgICB0YXJnZXRDb21wYXRpYmlsaXR5IEphdmFWZXJzaW9uLlZFUlNJT05fMTcKICAgIH0KfQ==')
    String newAndroidEnd = decodeText('ICAgIGNvbXBpbGVPcHRpb25zIHsKICAgICAgICBzb3VyY2VDb21wYXRpYmlsaXR5IEphdmFWZXJzaW9uLlZFUlNJT05fMTcKICAgICAgICB0YXJnZXRDb21wYXRpYmlsaXR5IEphdmFWZXJzaW9uLlZFUlNJT05fMTcKICAgIH0KCiAgICBhbmRyb2lkUmVzb3VyY2VzIHsKICAgICAgICBub0NvbXByZXNzICs9IFsndGZsaXRlJ10KICAgIH0KfQ==')
    if (appGradle.contains(oldAndroidEnd)) {
        appGradle = appGradle.replace(oldAndroidEnd, newAndroidEnd)
    }

    appGradleFile.write(appGradle, 'UTF-8')
}

def aiSourceFile = file('app/src/main/java/com/imagesplitter/app/AiUpscaler.java')
aiSourceFile.parentFile.mkdirs()
aiSourceFile.write(decodeText(''), 'UTF-8')

def launcherFile = file('app/src/main/res/drawable/ic_launcher_sketch.xml')
if (launcherFile.exists()) {
    launcherFile.write(decodeText(''), 'UTF-8')
}

def sourceFile = file('app/src/main/java/com/imagesplitter/app/MainActivity.java')
if (sourceFile.exists()) {
    String src = sourceFile.getText('UTF-8')

    def patch = { String old64, String new64, String marker ->
        String oldText = decodeText(old64)
        String newText = decodeText(new64)

        if (src.contains(oldText)) {
            src = src.replace(oldText, newText)
        } else if (!src.contains(marker)) {
            throw new GradleException('ImageSplitter UI patch missing source block: ' + marker)
        }
    }
