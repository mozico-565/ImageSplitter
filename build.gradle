'''        private void drawSizeTip(Canvas c) {
            float anchor=40+sizeTipChoice*161f+75.5f;
            int tipPaper=dark?0xFF27313B:0xFFF3F1EA;

            Path notch=new Path();
            notch.moveTo(anchor-17,1071);
            notch.lineTo(anchor,1049);
            notch.lineTo(anchor+17,1071);
            notch.close();
            p.setColor(tipPaper);
            c.drawPath(notch,p);

            fill(c,42,1070,678,1366,22,tipPaper);
            outline(c,42,1070,678,1366,22,ink());

            String[] labels={tr("Original","الأصلي","Original"),"750 px","1080 px",
                    tr("Custom","مخصص","Personalizado")};

            left(c,tr("Example (","مثال (","Ejemplo (")+labels[sizeTipChoice]+")",
                    68,1118,560,25,ink());

            if(sourceWidth<2||sourceHeight<2) {
                txt(c,tr("Select an image to calculate real dimensions",
                        "اختر صورة لحساب المقاسات الحقيقية",
                        "Selecciona una imagen para calcular"),
                        360,1228,570,23,muted);
            } else {
                int target=sizeTipChoice==0?0:sizeTipChoice==1?750:sizeTipChoice==2?1080:custom;
                int totalW=0,totalH=0;
                int firstW=0,firstH=0;

                for(int i=0;i<parts;i++){
                    int[] d=SplitEngine.outputPartDimensions(sourceWidth,sourceHeight,horizontal,parts,i,target);
                    if(i==0){firstW=d[0];firstH=d[1];}
                    if(horizontal){
                        totalW=Math.max(totalW,d[0]);
                        totalH+=d[1];
                    } else {
                        totalW+=d[0];
                        totalH=Math.max(totalH,d[1]);
                    }
                }

                previewTiles(c,preview,70,1145,320,1300);
                line(c,345,1138,345,1338,ink(),1.45f);

                left(c,"↔  "+firstW+" px",70,1332,125,18,muted);
                left(c,"↕  "+firstH+" px",205,1332,125,18,muted);

                left(c,tr("Each part:","كل جزء:","Cada parte:"),
                        375,1175,260,20,muted);
                left(c,firstW+" × "+firstH+" px",
                        375,1213,260,27,ink());

                left(c,tr("Joined size:","الحجم بعد الجمع:","Tamaño unido:"),
                        375,1264,260,20,muted);
                left(c,totalW+" × "+totalH+" px",
                        375,1304,275,27,ink());
                left(c,"("+parts+" "+tr("parts","أجزاء","partes")+")",
                        375,1338,260,20,muted);
            }

            hit(42,1070,678,1366,()->{sizeTip=false;invalidate();});
        }''',
'int tipPaper=dark?0xFF27313B:0xFFF3F1EA;'
