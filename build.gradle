plugins {
    id 'com.android.application' version '8.7.3' apply false
}

def decodeText = { String value ->
    new String(java.util.Base64.getDecoder().decode(value), 'UTF-8')
}

def b64 = { Object... parts -> parts.join('') }

def appGradleFile = file('app/build.gradle')
if (appGradleFile.exists()) {
    String appGradle = appGradleFile.getText('UTF-8')

    String oldDep = decodeText('ZGVwZW5kZW5jaWVzIHsKICAgIHRlc3RJbXBsZW1lbnRhdGlvbiAnanVuaXQ6anVuaXQ6NC4xMy4yJwp9')
    String newDep = decodeText(b64(
            'ZGVwZW5kZW5jaWVzIHsKICAgIGltcGxlbWVudGF0aW9uICdvcmcudGVuc29yZmxvdzp0ZW5zb3Jm',
            'bG93LWxpdGU6Mi4xNi4xJwogICAgdGVzdEltcGxlbWVudGF0aW9uICdqdW5pdDpqdW5pdDo0LjEz',
            'LjInCn0='
    ))
    if (appGradle.contains(oldDep)) {
        appGradle = appGradle.replace(oldDep, newDep)
    }

    String oldAndroidEnd = decodeText(b64(
            'ICAgIGNvbXBpbGVPcHRpb25zIHsKICAgICAgICBzb3VyY2VDb21wYXRpYmlsaXR5IEphdmFWZXJz',
            'aW9uLlZFUlNJT05fMTcKICAgICAgICB0YXJnZXRDb21wYXRpYmlsaXR5IEphdmFWZXJzaW9uLlZF',
            'UlNJT05fMTcKICAgIH0KfQ=='
