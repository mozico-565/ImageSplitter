plugins {
    id 'com.android.application' version '8.7.3' apply false
}

/*
 * ImageSplitter Lovable parity patch v3
 *
 * What this build-time patch does:
 * 1) Fixes the home-screen glitch / disappearing lower area by using a stable
 *    home canvas height again (slightly larger than stock for safer scrolling).
 * 2) Replaces the Split Direction icons only, without changing the rest of the
 *    button layout / colors / spacing.
 * 3) Updates the in-app logo + launcher icon to the approved Lovable style.
 * 4) Refines the long-press size info card.
 * 5) Slightly tunes border / divider / heading weight to match Lovable better.
 */

def sourceFile = file('app/src/main/java/com/imagesplitter/app/MainActivity.java')

if (sourceFile.exists()) {
    String src = sourceFile.getText('UTF-8')
    String original = src

    def replaceOnce = { String oldText, String newText, String marker ->
        if (src.contains(oldText)) {
            src = src.replace(oldText, newText)
        } else if (!src.contains(marker)) {
            throw new GradleException("ImageSplitter UI patch v3 could not find expected source block: ${marker}")
        }
    }

    // Stable home canvas again, just slightly taller than stock to avoid lower clipping.
    replaceOnce(
'''        int contentHeight = mode == 0 ? 1960 : mode == 1 ? 1450 : mode == 3 ? 1570 : 1450;''',
'''        int contentHeight = mode == 0 ? 2105 : mode == 1 ? 1450 : mode == 3 ? 1570 : 1450;''',
'mode == 0 ? 2105'
    )

    replaceOnce(
'''        scroll.setPadding(0, 0, 0, dp(28));''',
'''        scroll.setPadding(0, 0, 0, dp(72));''',
'scroll.setPadding(0, 0, 0, dp(72));'
    )

    // Border weight closer to Lovable.
    replaceOnce(
'''            p.setStyle(Paint.Style.STROKE);
            p.setStrokeWidth(1.6f);
            p.setColor(color);
            c.drawRoundRect(l, t, r, b, radius, radius, p);
            p.setStrokeWidth(.45f);''',
'''            p.setStyle(Paint.Style.STROKE);
            p.setStrokeWidth(2.05f);
            p.setColor(color);
            c.drawRoundRect(l, t, r, b, radius, radius, p);
            p.setStrokeWidth(.6f);''',
'p.setStrokeWidth(2.05f);'
    )

    // Headings a bit heavier; regular text unchanged.
    replaceOnce(
'''            p.setTypeface(handwriting); p.setTextAlign(Paint.Align.CENTER);
            p.setTextSize(size);''',
'''            p.setTypeface(handwriting); p.setTextAlign(Paint.Align.CENTER);
            p.setFakeBoldText(size >= 24f);
            p.setTextSize(size);''',
'p.setFakeBoldText(size >= 24f);'
    )

    replaceOnce(
'''            p.setTypeface(handwriting);
            p.setTextAlign(language.equals("ar") ? Paint.Align.RIGHT : Paint.Align.LEFT);
            p.setTextSize(size);''',
'''            p.setTypeface(handwriting);
            p.setTextAlign(language.equals("ar") ? Paint.Align.RIGHT : Paint.Align.LEFT);
            p.setFakeBoldText(size >= 24f);
            p.setTextSize(size);''',
'p.setTextAlign(language.equals("ar") ? Paint.Align.RIGHT : Paint.Align.LEFT);\n            p.setFakeBoldText(size >= 24f);'
    )

    // Critical scroll/render fix:
    // group() was rendering every animated section into a layer capped at y=1400,
    // so Preview / Split & Export below that point were literally clipped away.
    replaceOnce(
'''            int layer = c.saveLayerAlpha(0,0,720,1400,(int)(255*smooth));''',
'''            int layer = c.saveLayerAlpha(0,0,720,contentHeight,(int)(255*smooth));''',
'c.saveLayerAlpha(0,0,720,contentHeight'
    )

    // New Lovable-like Split Direction icons only.
    replaceOnce(
'''        private boolean isPressed(float l,float t,float r,float b){''',
'''        private void splitDirectionArt(Canvas c, String value, float l, float t, float r, float b,
                                       boolean selected, boolean horizontalIcon, Runnable click) {
            float inset = isPressed(l,t,r,b) ? 2.2f : 0f;
            fill(c,l+inset,t+inset,r-inset,b-inset,14,
                    selected?wash():(dark?0xFF202D37:0xFFF2F0EA));
            outline(c,l+inset,t+inset,r-inset,b-inset,14,
                    selected?accent:alpha(ink(),170));

            if(selected){
                p.setStyle(Paint.Style.STROKE);
                p.setStrokeWidth(.85f);
                p.setColor(alpha(accent,108));
                c.drawRoundRect(l+3,t+3,r-3,b-3,11,11,p);
            }

            float iconCenterX = l + 78f;
            float iconCenterY = (t + b) / 2f;

            p.setStyle(Paint.Style.STROKE);
            p.setStrokeWidth(3.6f);
            p.setStrokeCap(Paint.Cap.ROUND);
            p.setStrokeJoin(Paint.Join.ROUND);
            p.setColor(ink());

            if (horizontalIcon) {
                // Three flat rounded horizontal layers, no perspective.
                float[] widths = new float[]{48f, 56f, 52f};
                float itemH = 12f;
                float gap = 6f;
                for (int i = 0; i < 3; i++) {
                    float w = widths[i];
                    float top = iconCenterY - itemH * 1.5f - gap + i * (itemH + gap);
                    c.drawRoundRect(iconCenterX - w/2f, top, iconCenterX + w/2f, top + itemH,
                            5f, 5f, p);
                }
            } else {
                // Three nested pointed-end vertical family shapes, side-by-side.
                float outerH = 38f;
                float[] widths = new float[]{20f, 20f, 20f};
                float gap = 8f;
                for (int i = 0; i < 3; i++) {
                    float cx = iconCenterX - (widths.length - 1) * (gap + 2f) / 2f + i * (gap + 12f);
                    float w = widths[i];
                    float h = outerH - i * 3f;
                    Path q = new Path();
                    q.moveTo(cx - w/2f, iconCenterY);
                    q.lineTo(cx - 2f, iconCenterY - h/2f);
                    q.lineTo(cx + 2f, iconCenterY - h/2f);
                    q.lineTo(cx + w/2f, iconCenterY);
                    q.lineTo(cx + 2f, iconCenterY + h/2f);
                    q.lineTo(cx - 2f, iconCenterY + h/2f);
                    q.close();
                    c.drawPath(q, p);
                }
            }

            p.setStyle(Paint.Style.FILL);
            txt(c, value, l + (r - l) * .66f, (t + b) / 2f + 8, r - l - 122f, 23, ink());
            hit(l,t,r,b,click);
        }

        private boolean isPressed(float l,float t,float r,float b){''',
'private void splitDirectionArt(Canvas c, String value'
    )

    // Approved three-layer Lovable logo.
    replaceOnce(
'''        private void logo(Canvas c,float center,float top,float width,float height) {
            float l=center-width/2f,r=center+width/2f,unit=height/3f;
            p.setStyle(Paint.Style.FILL);p.setColor(background);
            c.drawRoundRect(l+5,top,r-2,top+unit-3,8,8,p);
            c.drawRoundRect(l,top+unit-1,r,top+unit*2-4,7,7,p);
            c.drawRoundRect(l+3,top+unit*2-2,r+3,top+height,10,10,p);
            outline(c,l+5,top,r-2,top+unit-3,8,ink());
            outline(c,l,top+unit-1,r,top+unit*2-4,7,ink());
            outline(c,l+3,top+unit*2-2,r+3,top+height,10,ink());
        }''',
'''        private void logo(Canvas c,float center,float top,float width,float height) {
            float topW = width * .72f;
            float middleW = width * .90f;
            float bottomW = width * .80f;
            float itemH = height * .245f;
            float gap = height * .075f;
            float y1 = top;
            float y2 = y1 + itemH + gap;
            float y3 = y2 + itemH + gap;

            p.setStyle(Paint.Style.STROKE);
            p.setStrokeWidth(Math.max(3.0f, width * .043f));
            p.setStrokeCap(Paint.Cap.ROUND);
            p.setStrokeJoin(Paint.Join.ROUND);
            p.setColor(ink());

            c.drawRoundRect(center - topW/2f, y1, center + topW/2f, y1 + itemH,
                    itemH * .42f, itemH * .42f, p);
            c.drawRoundRect(center - middleW/2f, y2, center + middleW/2f, y2 + itemH,
                    itemH * .42f, itemH * .42f, p);
            c.drawRoundRect(center - bottomW/2f, y3, center + bottomW/2f, y3 + itemH,
                    itemH * .42f, itemH * .42f, p);

            p.setStyle(Paint.Style.FILL);
        }''',
'float topW = width * .72f;'
    )

    replaceOnce(
'''                selectArt(c,tr("▱  Horizontal","▱  أفقي","▱  Horizontal"),
                        40,587,356,659,horizontal,()->{ horizontal=true;sizeTip=false;haptic(HapticFeedbackConstants.CLOCK_TICK);invalidate();});
                selectArt(c,tr("⟪  Vertical","⟪  عمودي","⟪  Vertical"),
                        364,587,680,659,!horizontal,()->{horizontal=false;sizeTip=false;haptic(HapticFeedbackConstants.CLOCK_TICK);invalidate();});''',
'''                splitDirectionArt(c,tr("Horizontal","أفقي","Horizontal"),
                        40,587,356,659,horizontal,true,()->{ horizontal=true;sizeTip=false;haptic(HapticFeedbackConstants.CLOCK_TICK);invalidate();});
                splitDirectionArt(c,tr("Vertical","عمودي","Vertical"),
                        364,587,680,659,!horizontal,false,()->{horizontal=false;sizeTip=false;haptic(HapticFeedbackConstants.CLOCK_TICK);invalidate();});''',
'splitDirectionArt(c,tr("Horizontal"'
    )

    // Lovable-style size hint card.
    replaceOnce(
'''        private void drawSizeTip(Canvas c) {
            float anchor=40+sizeTipChoice*161f+75.5f;
            Path notch=new Path();notch.moveTo(anchor-16,1072);notch.lineTo(anchor,1050);
            notch.lineTo(anchor+16,1072);notch.close();p.setColor(wash());c.drawPath(notch,p);
            box(c,42,1070,678,1348,22,wash());
            String[] labels={tr("Original","الأصلي","Original"),"750 px","1080 px",
                    tr("Custom","مخصص","Personalizado")};
            txt(c,tr("Example (","مثال (","Ejemplo (")+labels[sizeTipChoice]+")",360,1110,590,24,ink());
            if(sourceWidth<2||sourceHeight<2) {
                txt(c,tr("Select an image to calculate real dimensions",
                        "اختر صورة لحساب المقاسات الحقيقية",
                        "Selecciona una imagen para calcular"),360,1210,570,24,muted);
            } else {
                int target=sizeTipChoice==0?0:sizeTipChoice==1?750:sizeTipChoice==2?1080:custom;
                int totalW=horizontal?0:0,totalH=horizontal?0:0;
                int firstW=0,firstH=0;
                for(int i=0;i<parts;i++){
                    int[] d=SplitEngine.outputPartDimensions(sourceWidth,sourceHeight,horizontal,parts,i,target);
                    if(i==0){firstW=d[0];firstH=d[1];}
                    if(horizontal){totalW=Math.max(totalW,d[0]);totalH+=d[1];}
                    else{totalW+=d[0];totalH=Math.max(totalH,d[1]);}
                }
                previewTiles(c,preview,70,1130,315,1305);
                line(c,344,1138,344,1314,ink(),1f);
                left(c,tr("Each part:","كل جزء:","Cada parte:"),375,1178,260,21,muted);
                left(c,firstW+" × "+firstH+" px",375,1212,260,25,ink());
                left(c,tr("Total joined:","الإجمالي بعد الجمع:","Total unido:"),375,1255,260,21,muted);
                left(c,totalW+" × "+totalH+" px · "+parts+" "+tr("parts","أجزاء","partes"),375,1292,275,22,ink());
            }
            hit(42,1070,678,1348,()->{sizeTip=false;invalidate();});
        }''',
'''        private void drawSizeTip(Canvas c) {
            float anchor = 40 + sizeTipChoice * 161f + 75.5f;
            int tipPaper = dark ? 0xFF27313B : 0xFFF3F1EA;

            Path notch = new Path();
            notch.moveTo(anchor - 17, 1071);
            notch.lineTo(anchor, 1049);
            notch.lineTo(anchor + 17, 1071);
            notch.close();
            p.setColor(tipPaper);
            c.drawPath(notch, p);

            fill(c,42,1070,678,1366,22,tipPaper);
            outline(c,42,1070,678,1366,22,ink());

            String[] labels={tr("Original","الأصلي","Original"),"750 px","1080 px",
                    tr("Custom","مخصص","Personalizado")};

            left(c,tr("Example (","مثال (","Ejemplo (")+labels[sizeTipChoice]+")",
                    68,1118,560,25,ink());

            if(sourceWidth<2||sourceHeight<2) {
                txt(c,tr("Select an image to calculate real dimensions",
                        "اختر صورة لحساب المقاسات الحقيقية",
                        "Selecciona una imagen para calcular"),
                        360,1228,570,23,muted);
            } else {
                int target=sizeTipChoice==0?0:sizeTipChoice==1?750:sizeTipChoice==2?1080:custom;
                int totalW=0,totalH=0;
                int firstW=0,firstH=0;

                for(int i=0;i<parts;i++){
                    int[] d=SplitEngine.outputPartDimensions(sourceWidth,sourceHeight,horizontal,parts,i,target);
                    if(i==0){firstW=d[0];firstH=d[1];}
                    if(horizontal){
                        totalW=Math.max(totalW,d[0]);
                        totalH+=d[1];
                    } else {
                        totalW+=d[0];
                        totalH=Math.max(totalH,d[1]);
                    }
                }

                previewTiles(c,preview,70,1145,320,1300);
                line(c,345,1138,345,1338,ink(),1.35f);

                left(c,"↔  " + firstW + " px",70,1332,125,18,muted);
                left(c,"↕  " + firstH + " px",205,1332,125,18,muted);

                left(c,tr("Each part:","كل جزء:","Cada parte:"),375,1175,260,20,muted);
                left(c,firstW + " × " + firstH + " px",375,1213,260,27,ink());

                left(c,tr("Joined size:","الحجم بعد الجمع:","Tamaño unido:"),375,1264,260,20,muted);
                left(c,totalW + " × " + totalH + " px",375,1304,275,27,ink());
                left(c,"(" + parts + " " + tr("parts","أجزاء","partes") + ")",375,1338,260,20,muted);
            }

            hit(42,1070,678,1366,()->{sizeTip=false;invalidate();});
        }''',
'int tipPaper = dark ? 0xFF27313B : 0xFFF3F1EA;'
    )

    replaceOnce(
'''            p.setStyle(Paint.Style.STROKE); p.setStrokeWidth(1.5f);p.setColor(ink());''',
'''            p.setStyle(Paint.Style.STROKE); p.setStrokeWidth(1.85f);p.setColor(ink());''',
'p.setStrokeWidth(1.85f);p.setColor(ink());'
    )

    replaceOnce(
'''            p.setStyle(Paint.Style.STROKE);p.setStrokeWidth(1f);p.setColor(alpha(ink(),70));''',
'''            p.setStyle(Paint.Style.STROKE);p.setStrokeWidth(1.28f);p.setColor(alpha(ink(),82));''',
'p.setStrokeWidth(1.28f);p.setColor(alpha(ink(),82));'
    )

    if (src != original) {
        sourceFile.write(src, 'UTF-8')
        println 'Applied ImageSplitter Lovable parity patch v3.'
    } else {
        println 'ImageSplitter Lovable parity patch v3 already applied.'
    }
}

