'''        private void logo(Canvas c,float center,float top,float width,float height) {
            float topW=width*.72f;
            float middleW=width*.90f;
            float bottomW=width*.80f;
            float itemH=height*.245f;
            float gap=height*.075f;
            float y1=top;
            float y2=y1+itemH+gap;
            float y3=y2+itemH+gap;

            p.setStyle(Paint.Style.STROKE);
            p.setStrokeWidth(Math.max(3.2f,width*.045f));
            p.setStrokeCap(Paint.Cap.ROUND);
            p.setStrokeJoin(Paint.Join.ROUND);
            p.setColor(ink());

            c.drawRoundRect(center-topW/2f,y1,center+topW/2f,y1+itemH,
                    itemH*.42f,itemH*.42f,p);
            c.drawRoundRect(center-middleW/2f,y2,center+middleW/2f,y2+itemH,
                    itemH*.42f,itemH*.42f,p);
            c.drawRoundRect(center-bottomW/2f,y3,center+bottomW/2f,y3+itemH,
                    itemH*.42f,itemH*.42f,p);

            p.setStyle(Paint.Style.FILL);
        }''',
'float topW=width*.72f;'
