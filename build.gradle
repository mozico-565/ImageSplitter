plugins {
    id 'com.android.application' version '8.7.3' apply false
}

/*
 * ImageSplitter Lovable parity patch v4
 *
 * What this build-time patch does:
 * 1) Fixes the home-screen glitch / disappearing lower area by using a stable
 *    home canvas height again (slightly larger than stock for safer scrolling).
 * 2) Replaces the Split Direction icons only, without changing the rest of the
 *    button layout / colors / spacing.
 * 3) Updates the in-app logo + launcher icon to the approved Lovable style.
 * 4) Refines the long-press size info card.
 * 5) Slightly tunes border / divider / heading weight to match Lovable better.
 * 6) Adapts vertical rhythm and text scale to narrow/tall phone screens.
 * 7) Adds optional on-device ESRGAN AI enhancement (2x) after splitting.
 * 8) Draws a real stack icon next to Split & Export.
 */


// -----------------------------------------------------------------------------
// Optional on-device AI enhancement (ESRGAN / TensorFlow Lite)
// -----------------------------------------------------------------------------
def appGradleFile = file('app/build.gradle')
if (appGradleFile.exists()) {
    String appGradle = appGradleFile.getText('UTF-8')

    if (!appGradle.contains("org.tensorflow:tensorflow-lite:2.16.1")) {
        appGradle = appGradle.replace(
                "dependencies {\n    testImplementation 'junit:junit:4.13.2'",
                "dependencies {\n    implementation 'org.tensorflow:tensorflow-lite:2.16.1'\n    testImplementation 'junit:junit:4.13.2'")
    }

    if (!appGradle.contains("noCompress += ['tflite']")) {
        appGradle = appGradle.replace(
'''    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}''',
'''    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress += ['tflite']
    }
}''')
    }

    appGradleFile.write(appGradle, 'UTF-8')
}

def aiSourceFile = file('app/src/main/java/com/imagesplitter/app/AiUpscaler.java')
aiSourceFile.parentFile.mkdirs()
aiSourceFile.write('''package com.imagesplitter.app;

import android.content.ContentResolver;
import android.content.res.AssetFileDescriptor;
import android.content.res.AssetManager;
import android.graphics.Bitmap;
import android.graphics.BitmapFactory;
import android.net.Uri;

import org.tensorflow.lite.Interpreter;

import java.io.FileInputStream;
import java.io.InputStream;
import java.io.OutputStream;
import java.nio.MappedByteBuffer;
import java.nio.channels.FileChannel;
import java.util.ArrayList;
import java.util.List;

/**
 * Optional local super-resolution.
 *
 * Uses the TensorFlow Lite ESRGAN model on-device. The model itself is x4,
 * but ImageSplitter writes a safer x2 result to reduce RAM usage and export time
 * on mid-range phones.
 */
public final class AiUpscaler implements AutoCloseable {
    private static final String MODEL = "ESRGAN.tflite";
    private static final int FINAL_SCALE = 2;
    private static final long MAX_INPUT_PIXELS = 2_500_000L;

    private final Interpreter interpreter;
    private final int inputWidth;
    private final int inputHeight;
    private final int modelScale;

    public AiUpscaler(AssetManager assets) throws Exception {
        Interpreter.Options options = new Interpreter.Options();
        options.setNumThreads(Math.max(2, Math.min(4, Runtime.getRuntime().availableProcessors())));

        interpreter = new Interpreter(loadModel(assets), options);

        int[] inShape = interpreter.getInputTensor(0).shape();
        int[] outShape = interpreter.getOutputTensor(0).shape();

        if (inShape.length != 4 || outShape.length != 4) {
            throw new IllegalStateException("Unsupported ESRGAN tensor shape");
        }

        inputHeight = inShape[1];
        inputWidth = inShape[2];

        if (inputHeight <= 0 || inputWidth <= 0) {
            throw new IllegalStateException("Invalid ESRGAN input size");
        }

        int sy = outShape[1] / inputHeight;
        int sx = outShape[2] / inputWidth;
        modelScale = Math.min(sx, sy);

        if (modelScale < FINAL_SCALE) {
            throw new IllegalStateException("ESRGAN output scale is too small");
        }
    }

    private static MappedByteBuffer loadModel(AssetManager assets) throws Exception {
        AssetFileDescriptor fd = assets.openFd(MODEL);
        try (FileInputStream input = new FileInputStream(fd.getFileDescriptor());
             FileChannel channel = input.getChannel()) {
            return channel.map(
                    FileChannel.MapMode.READ_ONLY,
                    fd.getStartOffset(),
                    fd.getDeclaredLength());
        } finally {
            fd.close();
        }
    }

    public static void enhanceInPlace(
            ContentResolver resolver,
            AssetManager assets,
            List<Uri> images) throws Exception {

        if (images == null || images.isEmpty()) return;

        try (AiUpscaler upscaler = new AiUpscaler(assets)) {
            for (Uri uri : images) {
                Bitmap source;
                try (InputStream input = resolver.openInputStream(uri)) {
                    source = BitmapFactory.decodeStream(input);
                }

                if (source == null) {
                    throw new IllegalStateException("Unable to decode exported image");
                }

                Bitmap enhanced = null;
                try {
                    enhanced = upscaler.enhance(source);
                    try (OutputStream output = resolver.openOutputStream(uri, "wt")) {
                        if (output == null || !enhanced.compress(Bitmap.CompressFormat.PNG, 100, output)) {
                            throw new IllegalStateException("Unable to save AI enhanced image");
                        }
                    }
                } finally {
                    if (enhanced != null && enhanced != source && !enhanced.isRecycled()) {
                        enhanced.recycle();
                    }
                    if (!source.isRecycled()) source.recycle();
                }
            }
        }
    }

    public Bitmap enhance(Bitmap bitmap) {
        int width = bitmap.getWidth();
        int height = bitmap.getHeight();

        if ((long) width * height > MAX_INPUT_PIXELS) {
            throw new IllegalArgumentException(
                    "Image part is too large for safe on-device AI enhancement");
        }

        final int outputWidth = width * FINAL_SCALE;
        final int outputHeight = height * FINAL_SCALE;

        int[] sourcePixels = new int[width * height];
        bitmap.getPixels(sourcePixels, 0, width, 0, 0, width, height);

        int[] outputPixels = new int[outputWidth * outputHeight];

        float[][][][] input =
                new float[1][inputHeight][inputWidth][3];

        int modelOutH = inputHeight * modelScale;
        int modelOutW = inputWidth * modelScale;
        float[][][][] output =
                new float[1][modelOutH][modelOutW][3];

        int overlap = Math.max(2, Math.min(inputWidth, inputHeight) / 12);
        int stepX = Math.max(1, inputWidth - overlap * 2);
        int stepY = Math.max(1, inputHeight - overlap * 2);

        List<Integer> xs = tileStarts(width, inputWidth, stepX);
        List<Integer> ys = tileStarts(height, inputHeight, stepY);

        for (int startY : ys) {
            for (int startX : xs) {
                fillInput(
                        input,
                        sourcePixels,
                        width,
                        height,
                        startX,
                        startY);

                interpreter.run(input, output);

                int leftCrop = startX == 0 ? 0 : overlap;
                int topCrop = startY == 0 ? 0 : overlap;
                int rightCrop =
                        startX + inputWidth >= width ? 0 : overlap;
                int bottomCrop =
                        startY + inputHeight >= height ? 0 : overlap;

                int maxLocalX = Math.min(inputWidth - rightCrop, width - startX);
                int maxLocalY = Math.min(inputHeight - bottomCrop, height - startY);

                for (int localY = topCrop; localY < maxLocalY; localY++) {
                    int srcImageY = startY + localY;
                    for (int localX = leftCrop; localX < maxLocalX; localX++) {
                        int srcImageX = startX + localX;

                        int alpha =
                                (sourcePixels[srcImageY * width + srcImageX] >>> 24) & 0xFF;

                        for (int oy = 0; oy < FINAL_SCALE; oy++) {
                            int destY = srcImageY * FINAL_SCALE + oy;
                            int modelY =
                                    localY * modelScale
                                            + (oy * modelScale / FINAL_SCALE);

                            for (int ox = 0; ox < FINAL_SCALE; ox++) {
                                int destX = srcImageX * FINAL_SCALE + ox;
                                int modelX =
                                        localX * modelScale
                                                + (ox * modelScale / FINAL_SCALE);

                                int block =
                                        Math.max(1, modelScale / FINAL_SCALE);

                                float rr = 0f;
                                float gg = 0f;
                                float bb = 0f;
                                int samples = 0;

                                for (int by = 0; by < block; by++) {
                                    int yy = Math.min(modelOutH - 1, modelY + by);
                                    for (int bx = 0; bx < block; bx++) {
                                        int xx = Math.min(modelOutW - 1, modelX + bx);
                                        rr += output[0][yy][xx][0];
                                        gg += output[0][yy][xx][1];
                                        bb += output[0][yy][xx][2];
                                        samples++;
                                    }
                                }

                                int r = clamp(Math.round(rr / samples));
                                int g = clamp(Math.round(gg / samples));
                                int b = clamp(Math.round(bb / samples));

                                outputPixels[destY * outputWidth + destX] =
                                        (alpha << 24) | (r << 16) | (g << 8) | b;
                            }
                        }
                    }
                }
            }
        }

        Bitmap result =
                Bitmap.createBitmap(outputWidth, outputHeight, Bitmap.Config.ARGB_8888);
        result.setPixels(
                outputPixels,
                0,
                outputWidth,
                0,
                0,
                outputWidth,
                outputHeight);

        return result;
    }

    private static List<Integer> tileStarts(int size, int tile, int step) {
        ArrayList<Integer> result = new ArrayList<>();

        if (size <= tile) {
            result.add(0);
            return result;
        }

        int current = 0;
        while (current + tile < size) {
            result.add(current);
            current += step;
        }

        int last = Math.max(0, size - tile);
        if (result.isEmpty() || result.get(result.size() - 1) != last) {
            result.add(last);
        }

        return result;
    }

    private void fillInput(
            float[][][][] input,
            int[] pixels,
            int width,
            int height,
            int startX,
            int startY) {

        for (int y = 0; y < inputHeight; y++) {
            int sy = Math.min(height - 1, Math.max(0, startY + y));

            for (int x = 0; x < inputWidth; x++) {
                int sx = Math.min(width - 1, Math.max(0, startX + x));
                int pixel = pixels[sy * width + sx];

                input[0][y][x][0] = (pixel >> 16) & 0xFF;
                input[0][y][x][1] = (pixel >> 8) & 0xFF;
                input[0][y][x][2] = pixel & 0xFF;
            }
        }
    }

    private static int clamp(int value) {
        return Math.max(0, Math.min(255, value));
    }

    @Override
    public void close() {
        interpreter.close();
    }
}
''', 'UTF-8')

def esrganModel = file('app/src/main/assets/ESRGAN.tflite')

tasks.register('prepareEsrganModel') {
    outputs.file(esrganModel)

    doLast {
        if (esrganModel.exists() && esrganModel.length() > 1_000_000L) {
            println 'ESRGAN model already present.'
            return
        }

        esrganModel.parentFile.mkdirs()

        def temp = new File(esrganModel.parentFile, 'ESRGAN.tflite.part')
        if (temp.exists()) temp.delete()

        println 'Downloading TensorFlow Lite ESRGAN model...'

        new URL('https://storage.googleapis.com/download.tensorflow.org/models/tflite/esrgan/ESRGAN.tflite')
                .withInputStream { input ->
                    temp.withOutputStream { output ->
                        output << input
                    }
                }

        if (temp.length() < 1_000_000L) {
            temp.delete()
            throw new GradleException('Downloaded ESRGAN model is unexpectedly small.')
        }

        if (esrganModel.exists()) esrganModel.delete()
        if (!temp.renameTo(esrganModel)) {
            esrganModel.bytes = temp.bytes
            temp.delete()
        }
    }
}

gradle.projectsEvaluated {
    project(':app').tasks.named('preBuild').configure {
        dependsOn(rootProject.tasks.named('prepareEsrganModel'))
    }
}


def sourceFile = file('app/src/main/java/com/imagesplitter/app/MainActivity.java')

if (sourceFile.exists()) {
    String src = sourceFile.getText('UTF-8')
    String original = src

    def replaceOnce = { String oldText, String newText, String marker ->
        if (src.contains(oldText)) {
            src = src.replace(oldText, newText)
        } else if (!src.contains(marker)) {
            throw new GradleException("ImageSplitter UI patch v4 could not find expected source block: ${marker}")
        }
    }

    // Stable home canvas again, just slightly taller than stock to avoid lower clipping.
    replaceOnce(
'''        int contentHeight = mode == 0 ? 1960 : mode == 1 ? 1450 : mode == 3 ? 1570 : 1450;''',
'''        int contentHeight = mode == 0 ? 2105 : mode == 1 ? 1450 : mode == 3 ? 1570 : 1450;''',
'mode == 0 ? 2105'
    )

    replaceOnce(
'''        scroll.setPadding(0, 0, 0, dp(28));''',
'''        scroll.setPadding(0, 0, 0, dp(72));''',
'scroll.setPadding(0, 0, 0, dp(72));'
    )

    // Border weight closer to Lovable.
    replaceOnce(
'''            p.setStyle(Paint.Style.STROKE);
            p.setStrokeWidth(1.6f);
            p.setColor(color);
            c.drawRoundRect(l, t, r, b, radius, radius, p);
            p.setStrokeWidth(.45f);''',
'''            p.setStyle(Paint.Style.STROKE);
            p.setStrokeWidth(2.05f);
            p.setColor(color);
            c.drawRoundRect(l, t, r, b, radius, radius, p);
            p.setStrokeWidth(.6f);''',
'p.setStrokeWidth(2.05f);'
    )

    // Headings a bit heavier; regular text unchanged.
    replaceOnce(
'''            p.setTypeface(handwriting); p.setTextAlign(Paint.Align.CENTER);
            p.setTextSize(size);''',
'''            p.setTypeface(handwriting); p.setTextAlign(Paint.Align.CENTER);
            p.setFakeBoldText(size >= 24f);
            p.setTextSize(size);''',
'p.setFakeBoldText(size >= 24f);'
    )

    replaceOnce(
'''            p.setTypeface(handwriting);
            p.setTextAlign(language.equals("ar") ? Paint.Align.RIGHT : Paint.Align.LEFT);
            p.setTextSize(size);''',
'''            p.setTypeface(handwriting);
            p.setTextAlign(language.equals("ar") ? Paint.Align.RIGHT : Paint.Align.LEFT);
            p.setFakeBoldText(size >= 24f);
            p.setTextSize(size);''',
'p.setTextAlign(language.equals("ar") ? Paint.Align.RIGHT : Paint.Align.LEFT);\n            p.setFakeBoldText(size >= 24f);'
    )

    // Critical scroll/render fix:
    // group() was rendering every animated section into a layer capped at y=1400,
    // so Preview / Split & Export below that point were literally clipped away.
    replaceOnce(
'''            int layer = c.saveLayerAlpha(0,0,720,1400,(int)(255*smooth));''',
'''            int layer = c.saveLayerAlpha(0,0,720,contentHeight,(int)(255*smooth));''',
'c.saveLayerAlpha(0,0,720,contentHeight'
    )

    // New Lovable-like Split Direction icons only.
    replaceOnce(
'''        private boolean isPressed(float l,float t,float r,float b){''',
'''        private void splitDirectionArt(Canvas c, String value, float l, float t, float r, float b,
                                       boolean selected, boolean horizontalIcon, Runnable click) {
            float inset = isPressed(l,t,r,b) ? 2.2f : 0f;
            fill(c,l+inset,t+inset,r-inset,b-inset,14,
                    selected?wash():(dark?0xFF202D37:0xFFF2F0EA));
            outline(c,l+inset,t+inset,r-inset,b-inset,14,
                    selected?accent:alpha(ink(),170));

            if(selected){
                p.setStyle(Paint.Style.STROKE);
                p.setStrokeWidth(.85f);
                p.setColor(alpha(accent,108));
                c.drawRoundRect(l+3,t+3,r-3,b-3,11,11,p);
            }

            float iconCenterX = l + 78f;
            float iconCenterY = (t + b) / 2f;

            p.setStyle(Paint.Style.STROKE);
            p.setStrokeWidth(3.6f);
            p.setStrokeCap(Paint.Cap.ROUND);
            p.setStrokeJoin(Paint.Join.ROUND);
            p.setColor(ink());

            if (horizontalIcon) {
                // Three flat rounded horizontal layers, no perspective.
                float[] widths = new float[]{48f, 56f, 52f};
                float itemH = 12f;
                float gap = 6f;
                for (int i = 0; i < 3; i++) {
                    float w = widths[i];
                    float top = iconCenterY - itemH * 1.5f - gap + i * (itemH + gap);
                    c.drawRoundRect(iconCenterX - w/2f, top, iconCenterX + w/2f, top + itemH,
                            5f, 5f, p);
                }
            } else {
                // Three nested pointed-end vertical family shapes, side-by-side.
                float outerH = 38f;
                float[] widths = new float[]{20f, 20f, 20f};
                float gap = 8f;
                for (int i = 0; i < 3; i++) {
                    float cx = iconCenterX - (widths.length - 1) * (gap + 2f) / 2f + i * (gap + 12f);
                    float w = widths[i];
                    float h = outerH - i * 3f;
                    Path q = new Path();
                    q.moveTo(cx - w/2f, iconCenterY);
                    q.lineTo(cx - 2f, iconCenterY - h/2f);
                    q.lineTo(cx + 2f, iconCenterY - h/2f);
                    q.lineTo(cx + w/2f, iconCenterY);
                    q.lineTo(cx + 2f, iconCenterY + h/2f);
                    q.lineTo(cx - 2f, iconCenterY + h/2f);
                    q.close();
                    c.drawPath(q, p);
                }
            }

            p.setStyle(Paint.Style.FILL);
            txt(c, value, l + (r - l) * .66f, (t + b) / 2f + 8, r - l - 122f, 23, ink());
            hit(l,t,r,b,click);
        }

        private boolean isPressed(float l,float t,float r,float b){''',
'private void splitDirectionArt(Canvas c, String value'
    )

    // Approved three-layer Lovable logo.
    replaceOnce(
'''        private void logo(Canvas c,float center,float top,float width,float height) {
            float l=center-width/2f,r=center+width/2f,unit=height/3f;
