            'ICAgIGNvbXBpbGVPcHRpb25zIHsKICAgICAgICBzb3VyY2VDb21wYXRpYmlsaXR5IEphdmFWZXJz',
            'aW9uLlZFUlNJT05fMTcKICAgICAgICB0YXJnZXRDb21wYXRpYmlsaXR5IEphdmFWZXJzaW9uLlZF',
            'UlNJT05fMTcKICAgIH0KCiAgICBhbmRyb2lkUmVzb3VyY2VzIHsKICAgICAgICBub0NvbXByZXNz',
            'ICs9IFsndGZsaXRlJ10KICAgIH0KfQ=='
    ))
    if (appGradle.contains(oldAndroidEnd)) {
        appGradle = appGradle.replace(oldAndroidEnd, newAndroidEnd)
    }

    appGradleFile.write(appGradle, 'UTF-8')
}

