/*
 * ImageSplitter Lovable UI parity patch
 *
 * This single root Gradle file applies the approved UI fixes automatically
 * at build time, while preserving the current native Android architecture.
 */

def sourceFile = file('app/src/main/java/com/imagesplitter/app/MainActivity.java')

